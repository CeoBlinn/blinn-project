services:
  - type: web
    name: blinn-project
    env: node
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run prisma:migrate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blinn-db
          property: connectionString

databases:
  - name: blinn-db
    plan: starter 