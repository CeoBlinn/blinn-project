services:
  - type: web
    name: blinn-project-backend
    env: node
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blinn-db
          property: connectionString
    healthCheckPath: /health
    branch: main
    repo:
      provider: github
      name: CeoBlinn/blinn-project
      branch: main
      rootDir: backend

databases:
  - name: blinn-db
    plan: free
    ipAllowList: [] 