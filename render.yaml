services:
  - type: web
    name: blinn-backend
    env: node
    region: oregon
    buildCommand: |
      cd backend
      npm install
      npx prisma generate
      npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blinn-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true
    github:
      repo: CeoBlinn/blinn-project
      branch: main

databases:
  - name: blinn-db
    plan: free
    region: oregon
    ipAllowList: [] 