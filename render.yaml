services:
  - type: web
    name: blinn-project-backend
    env: node
    buildCommand: |
      export BACKEND_DIR=/opt/render/project/src/backend
      cd $BACKEND_DIR
      npm install
      npm run prisma:generate
      npm run prisma:migrate
      npm run build
    startCommand: |
      export BACKEND_DIR=/opt/render/project/src/backend
      cd $BACKEND_DIR
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blinn-db
          property: connectionString
    healthCheckPath: /health
    branch: main
    buildFilter:
      paths:
        - backend/**/*
        - render.yaml

databases:
  - name: blinn-db
    plan: starter 